<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>

<ng-container *ngIf="auth.isLogado(); else semLayout">
  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">
          <span class="material-symbols-outlined">account_balance_wallet</span>
        </div>
        <div class="brand-text">
          <div class="brand-name">FinanCerto</div>
          <div class="brand-sub">Controle Financeiro</div>
        </div>
      </div>

      <nav>
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">dashboard</span> Dashboard
        </a>
        <a routerLink="/contas" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">account_balance</span> Contas
        </a>
        <a routerLink="/categorias" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">category</span> Categorias
        </a>
        <a routerLink="/transacoes" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">swap_horiz</span> Transações
        </a>
        <a routerLink="/metas" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">flag</span> Metas
        </a>
        <a routerLink="/orcamento" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">pie_chart</span> Orçamento
        </a>
        <a routerLink="/simulador" routerLinkActive="active" class="nav-item">
          <span class="material-symbols-outlined">calculate</span> Simulador
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar">{{ getIniciais() }}</div>
          <div class="user-info">
            <span class="user-name">{{ auth.usuarioLogado()?.nmUsuario }}</span>
            <span class="user-email">{{ auth.usuarioLogado()?.dsEmail }}</span>
          </div>
        </div>
        <button class="logout-btn" (click)="logout()" pTooltip="Sair" tooltipPosition="right">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div></div>
      </header>
      <div class="app-content">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #semLayout>
  <router-outlet></router-outlet>
</ng-template>
