server {
  listen 8080;
  server_name financertopessoal.com.br www.financertopessoal.com.br;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64k;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://static.hotjar.com https://script.hotjar.com 'unsafe-inline'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.hotjar.com https://*.hotjar.io wss://*.hotjar.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://static.hotjar.com https://script.hotjar.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://static.hotjar.com https://script.hotjar.com https://survey-images.hotjar.com; font-src 'self' https://fonts.gstatic.com https://script.hotjar.com" always;

  location /Api/ {
    proxy_pass https://controle-financeiro-api.wittyriver-4d9268a0.brazilsouth.azurecontainerapps.io/Api/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name controle-financeiro-api.wittyriver-4d9268a0.brazilsouth.azurecontainerapps.io;
    proxy_set_header Host controle-financeiro-api.wittyriver-4d9268a0.brazilsouth.azurecontainerapps.io;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
